name: RAVINE Clean Rebuild Build

on:
  push:
    branches:
      - ravine/clean-rebuild
      - ravine/creator-growth-flow-2026-10-18
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Media catalog lint
        run: npx eslint components/RAVINEShortsBrowse.tsx components/RAVINEMediaCatalog.tsx components/RAVINEWorkCatalog.tsx 'app/[locale]/podcasts/page.tsx' 'app/[locale]/series/page.tsx' 'app/[locale]/videos/page.tsx' 'app/[locale]/documentaries/page.tsx' components/StudioUpload.tsx components/StudioWorkManager.tsx components/DirectMessages.tsx components/SavedWorksCollection.tsx 'app/[locale]/messages/page.tsx' 'app/[locale]/collections/page.tsx' components/SearchLauncher.tsx components/RAVINECollectionsDirectory.tsx components/RAVINECopyLinkButton.tsx 'app/[locale]/collections/page.tsx' app/actions/ravine-social.ts 'app/[locale]/discover/page.tsx' 'app/[locale]/search/page.tsx' 'app/[locale]/live/page.tsx' 'app/[locale]/creators/[id]/page.tsx' 'app/[locale]/work/[id]/page.tsx' 'app/api/media/video/[id]/route.ts' 'app/api/media/asset/[id]/route.ts' components/RAVINEPodcastPlayer.tsx components/RAVINEPlayerRuntime.tsx components/WatchActions.tsx components/FollowCreator.tsx lib/ravine-playback-core.ts lib/ravine-access.ts lib/ravine-video-access.ts lib/ravine-work-universe.ts components/RAVINEWorkContext.tsx 'app/[locale]/watch/[id]/page.tsx' 'app/[locale]/u/[username]/page.tsx' 'app/api/search/route.ts' 'app/[locale]/history/page.tsx' 'app/[locale]/library/page.tsx' 'app/[locale]/community/page.tsx' 'app/[locale]/community/[slug]/page.tsx' components/RAVINEEventsCatalog.tsx 'app/[locale]/events/page.tsx' 'app/[locale]/events/[id]/page.tsx' components/RAVINEEventManagement.tsx components/RAVINEEventCreateForm.tsx app/actions/ravine-live-events.ts 'app/[locale]/spaces/page.tsx' components/SearchLauncher.tsx components/SearchResultsPanel.tsx components/AccountMenu.tsx components/PrimaryNav.tsx components/SidebarNav.tsx components/MobileNav.tsx components/RAVINECreatorDirectory.tsx 'app/[locale]/creators/page.tsx' 'app/[locale]/notifications/page.tsx' 'app/[locale]/dashboard/page.tsx' 'app/[locale]/collections/page.tsx'

      - name: Governance checks
        run: npm run verify:ravine

      - name: Guest hero background mode regression test
        run: node --test tests/guest-hero-background-mode.test.mjs

      - name: Guest public browsing navigation tests
        run: node --test tests/guest-browse-navigation.test.mjs

      - name: Search modal accessibility tests
        run: node --test tests/search-modal-accessibility.test.mjs

      - name: Series and shared media catalog regression tests
        run: node --test tests/series-content-type.test.mjs

      - name: Studio media validation tests
        run: node --test tests/studio-media-validation.test.mjs

      - name: Studio work manager tests
        run: node --test tests/studio-work-manager.test.mjs

      - name: Public visibility regression tests
        run: node --test tests/public-visibility.test.mjs

      - name: Work access policy regression tests
        run: node --test tests/work-access.test.mjs

      - name: Watch interaction failure handling tests
        run: node --test tests/watch-actions-errors.test.mjs

      - name: Work creator-follow integration tests
        run: node --test tests/work-creator-follow.test.mjs

      - name: Related work regression tests
        run: node --test tests/related-work.test.mjs

      - name: Audio-only podcast playback regression tests
        run: node --test tests/audio-only-podcast.test.mjs

      - name: Discover taxonomy and query tests
        run: node --test tests/discover-taxonomy.test.mjs

      - name: Community privacy and membership tests
        run: node --test tests/community-access.test.mjs

      - name: Events schedule tests
        run: node --test tests/events-schedule.test.mjs

      - name: Creator directory regression tests
        run: node --test tests/creator-directory.test.mjs

      - name: Collections and boards regression tests
        run: node --test tests/collections-boards.test.mjs

      - name: Social surfaces regression tests
        run: node --test tests/social-surfaces.test.mjs

      - name: Account notification badge regression tests
        run: node --test tests/account-notifications.test.mjs

      - name: Creator application UI regression tests
        run: node --test tests/creator-apply-ui.test.mjs

      - name: Build
        run: npm run build
