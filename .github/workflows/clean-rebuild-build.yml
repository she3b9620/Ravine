name: RAVINE Clean Rebuild Build

on:
  push:
    branches:
      - ravine/clean-rebuild
      - ravine/creator-growth-flow-2026-10-18
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency security audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Media catalog lint
        run: npx eslint components/RAVINEShortsBrowse.tsx components/RAVINEMediaCatalog.tsx components/RAVINEWorkCatalog.tsx 'app/[locale]/podcasts/page.tsx' 'app/[locale]/series/page.tsx' components/StudioUpload.tsx components/StudioWorkManager.tsx components/DirectMessages.tsx components/SavedWorksCollection.tsx 'app/[locale]/messages/page.tsx' 'app/[locale]/collections/page.tsx' app/actions/ravine-social.ts 'app/[locale]/discover/page.tsx' 'app/[locale]/search/page.tsx' 'app/[locale]/live/page.tsx' 'app/[locale]/creators/[id]/page.tsx' 'app/[locale]/work/[id]/page.tsx' 'app/[locale]/watch/[id]/page.tsx' 'app/api/search/route.ts'

      - name: Governance checks
        run: npm run verify:ravine

      - name: Guest hero background mode regression test
        run: node --test tests/guest-hero-background-mode.test.mjs

      - name: Series and shared media catalog regression tests
        run: node --test tests/series-content-type.test.mjs

      - name: Studio media validation tests
        run: node --test tests/studio-media-validation.test.mjs

      - name: Studio work manager tests
        run: node --test tests/studio-work-manager.test.mjs

      - name: Public visibility regression tests
        run: node --test tests/public-visibility.test.mjs

      - name: Social surfaces regression tests
        run: node --test tests/social-surfaces.test.mjs

      - name: Creator application UI regression tests
        run: node --test tests/creator-apply-ui.test.mjs

      - name: Build
        run: npm run build
