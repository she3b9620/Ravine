name: Build RAVINE Clean Rebuild

on:
  push:
    branches:
      - ravine/clean-rebuild
  pull_request:
    branches:
      - ravine/clean-rebuild

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
