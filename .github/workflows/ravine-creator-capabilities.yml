name: RAVINE Creator Capability Tests

on:
  pull_request:
    branches:
      - ravine/clean-rebuild
    paths:
      - "lib/ravine-creator-capabilities.ts"
      - "lib/ravine-work-universe.ts"
      - "app/api/creator/publish-work/route.ts"
      - "app/api/admin/creator-tier/route.ts"
      - "app/api/studio/publish-work/route.ts"
      - "app/[locale]/studio/page.tsx"
      - "components/StudioUpload.tsx"
      - "components/StudioWorkManager.tsx"
      - "components/HomeWorkCard.tsx"
      - "components/RAVINEWorkPlayer.tsx"
      - "components/DiscoverFilters.tsx"
      - "app/[locale]/discover/page.tsx"
      - "app/[locale]/work/[id]/page.tsx"
      - "app/[locale]/creators/[id]/page.tsx"
      - "app/[locale]/search/page.tsx"
      - "app/[locale]/page.tsx"
      - "supabase/migrations/20261017110000_ravine_creator_capability_schema_foundation.sql"
      - "supabase/migrations/20261017130000_ravine_creator_publish_rpc.sql"
      - "supabase/migrations/20261017150000_ravine_creator_studio_bridge.sql"
      - "tests/ravine-creator-capabilities.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ravine-creator-capabilities.yml"
  push:
    branches:
      - "ravine/creator-capabilities-foundation-20261017"
    paths:
      - "lib/ravine-creator-capabilities.ts"
      - "lib/ravine-work-universe.ts"
      - "app/api/creator/publish-work/route.ts"
      - "app/api/admin/creator-tier/route.ts"
      - "app/api/studio/publish-work/route.ts"
      - "app/[locale]/studio/page.tsx"
      - "components/StudioUpload.tsx"
      - "components/StudioWorkManager.tsx"
      - "components/HomeWorkCard.tsx"
      - "components/RAVINEWorkPlayer.tsx"
      - "components/DiscoverFilters.tsx"
      - "app/[locale]/discover/page.tsx"
      - "app/[locale]/work/[id]/page.tsx"
      - "app/[locale]/creators/[id]/page.tsx"
      - "app/[locale]/search/page.tsx"
      - "app/[locale]/page.tsx"
      - "supabase/migrations/20261017110000_ravine_creator_capability_schema_foundation.sql"
      - "supabase/migrations/20261017130000_ravine_creator_publish_rpc.sql"
      - "supabase/migrations/20261017150000_ravine_creator_studio_bridge.sql"
      - "tests/ravine-creator-capabilities.test.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ravine-creator-capabilities.yml"

permissions:
  contents: read

jobs:
  creator-capability-tests:
    name: Creator tier policy tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test creator capability boundaries
        run: npm run test:ravine-capabilities

  app-quality:
    name: RAVINE lint and production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-placeholder-anon-key
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test-cloud
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: test-preset
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint changed capability files
        run: npx eslint app/api/admin/creator-tier/route.ts app/api/creator/publish-work/route.ts app/api/studio/publish-work/route.ts "app/[locale]/studio/page.tsx" "app/[locale]/discover/page.tsx" "app/[locale]/work/[id]/page.tsx" "app/[locale]/creators/[id]/page.tsx" "app/[locale]/search/page.tsx" "app/[locale]/page.tsx" components/StudioUpload.tsx components/StudioWorkManager.tsx components/HomeWorkCard.tsx components/RAVINEWorkPlayer.tsx components/DiscoverFilters.tsx lib/ravine-creator-capabilities.ts lib/ravine-work-universe.ts components/RAVINEWorkContext.tsx
      - name: Full repository lint
        run: npm run lint
      - name: Build
        run: npm run build

  app-build:
    name: RAVINE production build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-placeholder-anon-key
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: test-cloud
      NEXT_PUBLIC_CLOUDINARY_UPLOAD_PRESET: test-preset
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Build
        run: npm run build
